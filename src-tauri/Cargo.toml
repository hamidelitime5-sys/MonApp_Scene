[package]
name = "hamide-litime-software"
version = "1.0.0"
description = "Hamide Litime Software - Stage Prompter Pro & Studio MIDI VSampler 3 pour Windows 11"
authors = ["Hamide Litime Software"]
edition = "2021"

[lib]
name = "hamide_litime_software_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
